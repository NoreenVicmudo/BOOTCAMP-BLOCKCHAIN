<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPFS File Upload Form - Pinata</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }

      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
      }

      input[type="file"] {
        cursor: pointer;
        padding: 10px;
      }

      .file-info {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }

      .preview-container {
        margin-top: 10px;
        text-align: center;
      }

      .preview-image {
        max-width: 200px;
        max-height: 200px;
        border-radius: 8px;
        border: 2px solid #e0e0e0;
        margin-top: 10px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        font-size: 14px;
        word-break: break-all;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .required {
        color: #e74c3c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📋 IPFS Upload Form</h1>
      <p class="subtitle">
        Upload your profile information and files to IPFS via Pinata
      </p>

      <form id="uploadForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="firstName"
            >First Name <span class="required">*</span></label
          >
          <input
            type="text"
            id="firstName"
            name="firstName"
            required
            placeholder="Enter your first name"
          />
        </div>

        <div class="form-group">
          <label for="lastName"
            >Last Name <span class="required">*</span></label
          >
          <input
            type="text"
            id="lastName"
            name="lastName"
            required
            placeholder="Enter your last name"
          />
        </div>

        <div class="form-group">
          <label for="middleName">Middle Name</label>
          <input
            type="text"
            id="middleName"
            name="middleName"
            placeholder="Enter your middle name (optional)"
          />
        </div>

        <div class="form-group">
          <label for="position">Position <span class="required">*</span></label>
          <input
            type="text"
            id="position"
            name="position"
            required
            placeholder="Enter your position/job title"
          />
        </div>

        <div class="form-group">
          <label for="pictureInput"
            >2x2 Picture <span class="required">*</span></label
          >
          <input
            type="file"
            id="pictureInput"
            name="picture"
            accept="image/*"
            required
          />
          <div class="preview-container" id="picturePreview"></div>
        </div>

        <div class="form-group">
          <label for="resumeInput"
            >Resume / CV <span class="required">*</span></label
          >
          <input
            type="file"
            id="resumeInput"
            name="resume"
            accept=".pdf,.doc,.docx"
            required
          />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Upload to IPFS via Pinata
        </button>
      </form>

      <div id="status"></div>
    </div>

    <script type="application/javascript">
      const PINATA_JWT =
        "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiI2MjY0NzYxZi0xOTg0LTQ3MTEtOWM4Ni1mMDRlYTY1MDAyNWIiLCJlbWFpbCI6InZpY211ZG9ub3JlZW4xMjBAZ21haWwuY29tIiwiZW1haWxfdmVyaWZpZWQiOnRydWUsInBpbl9wb2xpY3kiOnsicmVnaW9ucyI6W3siZGVzaXJlZFJlcGxpY2F0aW9uQ291bnQiOjEsImlkIjoiRlJBMSJ9LHsiZGVzaXJlZFJlcGxpY2F0aW9uQ291bnQiOjEsImlkIjoiTllDMSJ9XSwidmVyc2lvbiI6MX0sIm1mYV9lbmFibGVkIjpmYWxzZSwic3RhdHVzIjoiQUNUSVZFIn0sImF1dGhlbnRpY2F0aW9uVHlwZSI6InNjb3BlZEtleSIsInNjb3BlZEtleUtleSI6Ijc3N2FhMWI2Y2M3NDUxYWI1OTY0Iiwic2NvcGVkS2V5U2VjcmV0IjoiYmIyZjk3ZjlmM2Y3OTFkNTE1YTNmYzI1ZmM5YzJhODMzZmUxODJhZTg2ZGQ3ZjI2MTg2MzkxYWQxOTRlODM2ZiIsImV4cCI6MTc5NTY5NjcyN30.pV1KxkM1Qdo_LWWg5qK2KKrC-oba0nuW7kruHJrUwkI";

      // Preview image when selected
      document
        .getElementById("pictureInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          const previewContainer = document.getElementById("picturePreview");

          if (file && file.type.startsWith("image/")) {
            const reader = new FileReader();
            reader.onload = function (e) {
              previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview" class="preview-image" />`;
            };
            reader.readAsDataURL(file);
          } else {
            previewContainer.innerHTML = "";
          }
        });

      async function uploadFileToIPFS(file) {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(
          "https://api.pinata.cloud/pinning/pinFileToIPFS",
          {
            method: "POST",
            body: formData,
            headers: {
              Authorization: PINATA_JWT,
            },
          }
        );

        if (!response.ok) {
          const error = await response.json();
          throw new Error(
            error.error?.details || "Failed to upload file to IPFS"
          );
        }

        const result = await response.json();
        return result.IpfsHash;
      }

      async function uploadJSONToIPFS(metadata) {
        const response = await fetch(
          "https://api.pinata.cloud/pinning/pinJSONToIPFS",
          {
            method: "POST",
            body: JSON.stringify(metadata),
            headers: {
              "Content-Type": "application/json",
              Authorization: PINATA_JWT,
            },
          }
        );

        if (!response.ok) {
          const error = await response.json();
          throw new Error(
            error.error?.details || "Failed to upload JSON to IPFS"
          );
        }

        const result = await response.json();
        return result.IpfsHash;
      }

      function showStatus(message, type = "info") {
        const statusDiv = document.getElementById("status");
        statusDiv.className = `status ${type}`;
        statusDiv.innerHTML = message;
        statusDiv.style.display = "block";
      }

      function setLoading(isLoading) {
        const submitBtn = document.getElementById("submitBtn");
        if (isLoading) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="loading"></span>Uploading...';
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Upload to IPFS via Pinata";
        }
      }

      async function handleSubmit(event) {
        event.preventDefault();

        // Get form values
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const middleName = document.getElementById("middleName").value.trim();
        const position = document.getElementById("position").value.trim();
        const pictureFile = document.getElementById("pictureInput").files[0];
        const resumeFile = document.getElementById("resumeInput").files[0];

        // Validate required fields
        if (
          !firstName ||
          !lastName ||
          !position ||
          !pictureFile ||
          !resumeFile
        ) {
          showStatus(
            "Please fill in all required fields and upload both files.",
            "error"
          );
          return;
        }

        setLoading(true);
        showStatus("Uploading files to IPFS...", "info");

        try {
          // Upload picture to IPFS
          showStatus("Uploading 2x2 picture...", "info");
          const pictureHash = await uploadFileToIPFS(pictureFile);
          const pictureUrl = `https://ipfs.io/ipfs/${pictureHash}`;

          // Upload resume to IPFS
          showStatus("Uploading Resume/CV...", "info");
          const resumeHash = await uploadFileToIPFS(resumeFile);
          const resumeUrl = `https://ipfs.io/ipfs/${resumeHash}`;

          // Create metadata object
          const metadata = {
            firstName: firstName,
            lastName: lastName,
            middleName: middleName || null,
            position: position,
            picture: {
              hash: pictureHash,
              url: pictureUrl,
              filename: pictureFile.name,
              type: pictureFile.type,
              size: pictureFile.size,
            },
            resume: {
              hash: resumeHash,
              url: resumeUrl,
              filename: resumeFile.name,
              type: resumeFile.type,
              size: resumeFile.size,
            },
            uploadedAt: new Date().toISOString(),
            timestamp: Date.now(),
          };

          // Upload metadata to IPFS
          showStatus("Uploading metadata...", "info");
          const metadataHash = await uploadJSONToIPFS(metadata);
          const metadataUrl = `https://ipfs.io/ipfs/${metadataHash}`;

          // Display success message
          const successMessage = `
            <strong>✅ Upload Successful!</strong><br><br>
            <strong>Metadata IPFS Hash:</strong><br>
            <a href="${metadataUrl}" target="_blank">${metadataHash}</a><br><br>
            <strong>2x2 Picture:</strong><br>
            <a href="${pictureUrl}" target="_blank">${pictureUrl}</a><br><br>
            <strong>Resume/CV:</strong><br>
            <a href="${resumeUrl}" target="_blank">${resumeUrl}</a><br><br>
            <strong>Full Name:</strong> ${firstName} ${
            middleName ? middleName + " " : ""
          }${lastName}<br>
            <strong>Position:</strong> ${position}
          `;
          showStatus(successMessage, "success");
        } catch (error) {
          console.error("Upload error:", error);
          showStatus(`❌ Error: ${error.message}`, "error");
        } finally {
          setLoading(false);
        }
      }
    </script>
  </body>
</html>
